<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Pages 測試</title>
<style>
  :root {
    --bg: #f6f4ee;
    --card: #ffffff;
    --text: #2b2a27;
    --muted: #6b6860;
    --accent: #2f7d5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --card: #262522;
      --text: #ecebe6;
      --muted: #a8a59c;
      --accent: #5fbf92;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  main {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  }
  .mark { font-size: 48px; color: var(--accent); line-height: 1; }
  h1 { font-size: 24px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 4px 0; line-height: 1.7; }
  #now { color: var(--text); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <div class="mark">✓</div>
  <h1>GitHub Pages 測試成功</h1>
  <p>這個網頁放在 GitHub 上，任何裝置都能打開。</p>
  <p>建立日期：2026 年 11 月 1 日</p>
  <p>現在時間：<span id="now"></span></p>
</main>
<script>
  const now = document.getElementById("now");
  const tick = () => { now.textContent = new Date().toLocaleString("zh-TW", { hour12: false }); };
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
